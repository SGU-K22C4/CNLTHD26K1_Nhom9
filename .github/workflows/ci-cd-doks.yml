name: CI-CD DOKS

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - setup/pipelinecicd
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to DOKS after pushing Docker images
        required: false
        default: true
        type: boolean
      image_tag:
        description: Optional image tag override (defaults to short commit SHA)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fashion-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  K8S_NAMESPACE: fashion
  DOCR_REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY_NAME }}

jobs:
  ci:
    name: Build and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test backend modules
        run: |
          mvn -v
          mvn -f backend/pom.xml -B clean verify

      - name: Upload backend JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-reports
          path: |
            backend/services/*/target/site/jacoco/
          if-no-files-found: warn

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ecommerce-frontend

      - name: Build frontend
        run: npm run build
        working-directory: ecommerce-frontend

  docker-publish:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: user-service
            repository: fashion-auth
            tag_prefix: user
            context: backend
            dockerfile: backend/services/user-service/Dockerfile
          - service_name: product-service
            repository: fashion-catalog
            tag_prefix: product
            context: backend
            dockerfile: backend/services/product-service/Dockerfile
          - service_name: promotion-service
            repository: fashion-catalog
            tag_prefix: promotion
            context: backend
            dockerfile: backend/services/promotion-service/Dockerfile
          - service_name: cart-service
            repository: fashion-ordering
            tag_prefix: cart
            context: backend
            dockerfile: backend/services/cart-service/Dockerfile
          - service_name: order-service
            repository: fashion-ordering
            tag_prefix: order
            context: backend
            dockerfile: backend/services/order-service/Dockerfile
          - service_name: review-service
            repository: fashion-engagement
            tag_prefix: review
            context: backend
            dockerfile: backend/services/review-service/Dockerfile
          - service_name: chatbot-service
            repository: fashion-engagement
            tag_prefix: chatbot
            context: backend
            dockerfile: backend/services/chatbot-service/Dockerfile
          - service_name: frontend
            repository: fashion-frontend
            tag_prefix: frontend
            context: ecommerce-frontend
            dockerfile: ecommerce-frontend/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate registry variable
        run: |
          if [ -z "${{ vars.DOCR_REGISTRY_NAME }}" ]; then
            echo "::error::Missing repository variable DOCR_REGISTRY_NAME"
            exit 1
          fi

      - name: Resolve image tag
        id: image_tag
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            echo "value=$REQUESTED_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login Docker to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.DOCR_REGISTRY }}/${{ matrix.repository }}:${{ matrix.tag_prefix }}-${{ steps.image_tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service_name }}

  deploy-doks:
    name: Deploy to DOKS
    runs-on: ubuntu-latest
    needs: docker-publish
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment variables
        run: |
          if [ -z "${{ vars.DOCR_REGISTRY_NAME }}" ]; then
            echo "::error::Missing repository variable DOCR_REGISTRY_NAME"
            exit 1
          fi

          if [ -z "${{ vars.DOKS_CLUSTER_NAME }}" ]; then
            echo "::error::Missing repository variable DOKS_CLUSTER_NAME"
            exit 1
          fi

      - name: Resolve image tag
        id: image_tag
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            echo "value=$REQUESTED_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DOKS_CLUSTER_NAME }}"

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Sync Kubernetes secrets from GitHub secrets
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          REVIEW_MONGODB_URI: ${{ secrets.REVIEW_MONGODB_URI }}
          CHATBOT_MONGODB_URI: ${{ secrets.CHATBOT_MONGODB_URI }}
          KONG_TLS_CRT: ${{ secrets.KONG_TLS_CRT }}
          KONG_TLS_KEY: ${{ secrets.KONG_TLS_KEY }}
        run: |
          if [ -z "$MYSQL_ROOT_PASSWORD" ]; then
            echo "::error::Missing GitHub secret MYSQL_ROOT_PASSWORD"
            exit 1
          fi

          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Missing GitHub secret JWT_SECRET"
            exit 1
          fi

          if [ -z "$REVIEW_MONGODB_URI" ]; then
            echo "::error::Missing GitHub secret REVIEW_MONGODB_URI"
            exit 1
          fi

          if [ -z "$CHATBOT_MONGODB_URI" ]; then
            echo "::error::Missing GitHub secret CHATBOT_MONGODB_URI"
            exit 1
          fi

          kubectl -n "$K8S_NAMESPACE" create secret generic fashion-secrets \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --from-literal=VNPAY_TMN_CODE="${VNPAY_TMN_CODE:-XWJEG5N8}" \
            --from-literal=VNPAY_HASH_SECRET="$VNPAY_HASH_SECRET" \
            --from-literal=OLLAMA_API_KEY="$OLLAMA_API_KEY" \
            --from-literal=AI_API_KEY="$AI_API_KEY" \
            --from-literal=REVIEW_MONGODB_URI="$REVIEW_MONGODB_URI" \
            --from-literal=CHATBOT_MONGODB_URI="$CHATBOT_MONGODB_URI" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Recreate the origin TLS secret when certificate material is available in GitHub.
          if [ -n "$KONG_TLS_CRT" ] && [ -n "$KONG_TLS_KEY" ]; then
            printf '%s' "$KONG_TLS_CRT" > /tmp/kong-tls.crt
            printf '%s' "$KONG_TLS_KEY" > /tmp/kong-tls.key

            kubectl -n "$K8S_NAMESPACE" create secret tls cloudflare-origin-tls \
              --cert=/tmp/kong-tls.crt \
              --key=/tmp/kong-tls.key \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::Skipping cloudflare-origin-tls sync because KONG_TLS_CRT/KONG_TLS_KEY are not configured."
          fi

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmaps.yaml
          kubectl apply -f k8s/databases.yaml
          kubectl apply -f k8s/microservices.yaml
          kubectl apply -f k8s/kong.yaml

      - name: Update deployment images with immutable tag
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.value }}
        run: |
          declare -a deployments=(
            "user-service:user-service:fashion-auth:user"
            "product-service:product-service:fashion-catalog:product"
            "promotion-service:promotion-service:fashion-catalog:promotion"
            "cart-service:cart-service:fashion-ordering:cart"
            "order-service:order-service:fashion-ordering:order"
            "review-service:review-service:fashion-engagement:review"
            "chatbot-service:chatbot-service:fashion-engagement:chatbot"
            "frontend:frontend:fashion-frontend:frontend"
          )

          for item in "${deployments[@]}"; do
            IFS=":" read -r deployment container repository tag_prefix <<< "$item"
            kubectl -n "$K8S_NAMESPACE" set image "deployment/$deployment" \
              "$container=$DOCR_REGISTRY/$repository:$tag_prefix-$IMAGE_TAG"
          done

      - name: Wait for rollout
        run: |
          declare -a deployments=(
            user-service
            product-service
            cart-service
            order-service
            promotion-service
            review-service
            chatbot-service
            frontend
          )

          for deployment in "${deployments[@]}"; do
            if ! kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$deployment" --timeout=600s; then
              echo "::error::Rollout failed for deployment/$deployment"
              kubectl -n "$K8S_NAMESPACE" describe "deployment/$deployment" || true
              kubectl -n "$K8S_NAMESPACE" get pods -l "app=$deployment" -o wide || true

              for pod in $(kubectl -n "$K8S_NAMESPACE" get pods -l "app=$deployment" -o jsonpath='{.items[*].metadata.name}'); do
                echo "--- describe pod/$pod ---"
                kubectl -n "$K8S_NAMESPACE" describe "pod/$pod" || true
                echo "--- logs pod/$pod (current) ---"
                kubectl -n "$K8S_NAMESPACE" logs "$pod" --tail=200 || true
                echo "--- logs pod/$pod (previous) ---"
                kubectl -n "$K8S_NAMESPACE" logs "$pod" --previous --tail=200 || true
              done

              exit 1
            fi
          done
