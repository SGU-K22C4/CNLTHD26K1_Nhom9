server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true

      routes:
        # Auth & User
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - name: JwtAuthFilter

        # Products
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
          filters:
            - StripPrefix=0

        # Cart (no JWT — supports guest users via X-User-Id header)
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - StripPrefix=0

        # Orders (no JWT — supports guest checkout via X-User-Id header)
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        # Payments / VNPay (no JWT — guest users can pay)
        - id: payment-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        # Promotions
        - id: promotion-service
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/promotions/**
          filters:
            - StripPrefix=0

        # Reviews
        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - StripPrefix=0

        # Chatbot
        - id: chatbot-service
          uri: ${CHATBOT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/chatbot/**
          filters:
            - StripPrefix=0

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_base64_encoded_secret_key_at_least_32_bytes}

logging:
  level:
    org.springframework.cloud.gateway: INFO
