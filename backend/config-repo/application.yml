# CẤU HÌNH DÙNG CHUNG CHO TẤT CẢ CÁC MICROSERVICES
# Mọi service (user, product, order...) khi kết nối tới Config Server đều sẽ nhận cấu hình này

spring:
  # Cấu hình mail (nếu các service khác cũng có xài gửi mail)
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:2525}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT dùng chung cho tất cả service để giải mã token
jwt:
  # Do not fallback to a static shared secret in source code.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${spring.mail.username}}
