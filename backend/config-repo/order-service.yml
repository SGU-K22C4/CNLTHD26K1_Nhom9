server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fashion_order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:XWJEG5N8}
  hash-secret: ${VNPAY_HASH_SECRET:V0UJ9R7MWMJLFJREF60KQR5P9RO1XIYH}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
