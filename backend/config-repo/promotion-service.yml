server:
  port: 8085

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fashion_promotion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ddl-auto: validate
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

loyalty:
  point-to-vnd: ${LOYALTY_POINT_TO_VND:100}
  order-point-percent: ${LOYALTY_ORDER_POINT_PERCENT:0.01}
  review-bonus-points: ${LOYALTY_REVIEW_BONUS_POINTS:10}

app:
  kafka:
    saga:
      retry-attempts: ${SAGA_RETRY_ATTEMPTS:4}
      retry-delay-ms: ${SAGA_RETRY_DELAY_MS:1000}
      retry-multiplier: ${SAGA_RETRY_MULTIPLIER:2.0}
