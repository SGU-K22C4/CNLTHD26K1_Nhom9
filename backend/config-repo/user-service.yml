server:
  port: 8081

spring:
  datasource:
    # URL mặc định sẽ trỏ vào localhost:3306. Muốn đổi sang server prod thì map biến môi trường vào!
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fashion_user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:huytran123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      #dùng validate khi đã có database cần validate , ngoài ra nếu chạy lần đầu thì dùng update
      # ddl-auto: validate
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:pcshop7153@gmail.com}
    password: ${EMAIL_PASSWORD:tvpwqiovicyfkbfq}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.fashion.userservice: DEBUG
    org.springframework.security: INFO

app:
  auth:
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
