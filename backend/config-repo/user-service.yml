server:
  port: 8081

spring:
  datasource:
    # URL mặc định sẽ trỏ vào localhost:3306. Muốn đổi sang server prod thì map biến môi trường vào!
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fashion_user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:huytran123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:2525}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${EMAIL_USERNAME:}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${EMAIL_PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.fashion.userservice: DEBUG
    org.springframework.security: INFO

app:
  mail:
    from: ${MAIL_FROM:${spring.mail.username}}
  auth:
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
