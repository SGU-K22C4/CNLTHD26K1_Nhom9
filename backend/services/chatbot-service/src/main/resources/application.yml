spring:
  application:
    name: chatbot-service
  config:
    import: "optional:configserver:http://localhost:8888"
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/fashion_chatbot_db}

# === Service URLs ===
chatbot:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8080}
  promotion-service-url: ${PROMOTION_SERVICE_URL:http://localhost:8080}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8080}
  cart-service-url: ${CART_SERVICE_URL:http://localhost:8080}
  review-service-url: ${REVIEW_SERVICE_URL:http://localhost:8088}
  internal:
    caller: ${CHATBOT_INTERNAL_CALLER:chatbot-service}
    shared-secret: ${INTERNAL_SERVICE_SHARED_SECRET:local-chatbot-internal-secret}
  security:
    allow-direct-user-header: ${CHATBOT_ALLOW_DIRECT_USER_HEADER:true}
  resilience:
    failure-rate-threshold: ${CHATBOT_RESILIENCE_FAILURE_RATE_THRESHOLD:50}
    sliding-window-size: ${CHATBOT_RESILIENCE_SLIDING_WINDOW_SIZE:10}
    minimum-number-of-calls: ${CHATBOT_RESILIENCE_MIN_CALLS:5}
    wait-duration-ms: ${CHATBOT_RESILIENCE_WAIT_MS:250}
    timeout-ms: ${CHATBOT_RESILIENCE_TIMEOUT_MS:3000}
    bulkhead:
      max-concurrent-calls: ${CHATBOT_RESILIENCE_MAX_CONCURRENT_CALLS:12}
    retry:
      max-attempts: ${CHATBOT_RESILIENCE_MAX_ATTEMPTS:2}

  # Agent mode: true = LangChain4j agent, false = heuristic fallback
  use-agent: ${CHATBOT_USE_AGENT:true}

  # Rate Limiting — Phase 3B
  ratelimit:
    user-requests-per-minute: ${CHATBOT_RATELIMIT_USER_RPM:20}
    global-requests-per-minute: ${CHATBOT_RATELIMIT_GLOBAL_RPM:200}
    timeout-ms: ${CHATBOT_RATELIMIT_TIMEOUT_MS:1000}

  # A/B Experiment — Phase 3C
  experiment:
    enabled: ${CHATBOT_EXPERIMENT_ENABLED:false}
    control-ratio: ${CHATBOT_EXPERIMENT_CONTROL_RATIO:70}

  # Memory
  memory:
    max-messages: ${CHATBOT_MEMORY_MAX_MESSAGES:20}
    # Session eviction: tránh OOM khi service chạy lâu (Review.md: memory leak fix)
    session-ttl-hours: ${CHATBOT_MEMORY_SESSION_TTL_HOURS:2}
    max-sessions: ${CHATBOT_MEMORY_MAX_SESSIONS:5000}

  # Knowledge Base
  knowledge:
    enabled: ${CHATBOT_KB_ENABLED:true}
    data-path: classpath:knowledge
    top-k: 4
    min-score: 0.3
    graphrag:
      enabled: ${CHATBOT_GRAPHRAG_ENABLED:true}
      merge-weight: ${CHATBOT_GRAPHRAG_MERGE_WEIGHT:0.45}
      max-keywords-per-chunk: ${CHATBOT_GRAPHRAG_MAX_KEYWORDS:8}
      max-hits: ${CHATBOT_GRAPHRAG_MAX_HITS:12}
      related-threshold: ${CHATBOT_GRAPHRAG_RELATED_THRESHOLD:0.25}
      adjacent-boost: ${CHATBOT_GRAPHRAG_ADJACENT_BOOST:0.25}
      related-boost: ${CHATBOT_GRAPHRAG_RELATED_BOOST:0.35}

# # === LLM Provider (Ollama) ===
# # Supports both local Ollama and tunnel/cloud URLs.
# # Service uses LangChain4j OllamaChatModel (native Ollama API).
# ollama:
#   api-key: ${OLLAMA_API_KEY:}
#   model: ${OLLAMA_MODEL:gpt-oss:20b}
#   fallback-model: ${OLLAMA_FALLBACK_MODEL:gpt-oss:20b}
#   timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
#   fallback-timeout-seconds: ${OLLAMA_FALLBACK_TIMEOUT_SECONDS:90}
#   # Can be either host URL (http://localhost:11434) or full endpoint (.../api/chat).
#   base-url: ${OLLAMA_BASE_URL:https://syncopated-pedagogic-nadia.ngrok-free.dev/api/chat}
#   max-tokens: ${OLLAMA_MAX_TOKENS:600}
#   site-url: ${OLLAMA_SITE_URL:http://localhost:8087}
#   app-name: ${OLLAMA_APP_NAME:fashion-chatbot-service}
# === LLM Provider (DeepSeek via chiasegpu) ===
ai:
  api-key: ${AI_API_KEY}
  model: ${AI_MODEL:deepseek-3.2}
  base-url: ${AI_BASE_URL:https://llm.chiasegpu.vn/v1}
  # Timeout 60s: cân bằng UX vs complex tool calling (Review.md: 180s quá cao)
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  # maxTokens aligned: Java default 4096 = YAML default 4096 (fix inconsistency)
  max-tokens: ${AI_MAX_TOKENS:10000}
  # Privacy: log OFF by default, chỉ bật khi debug với AI_LOG_REQUESTS=true
  log-requests: ${AI_LOG_REQUESTS:false}
  log-responses: ${AI_LOG_RESPONSES:false}

server:
  port: ${SERVER_PORT:8087}

# ── Monitoring (Prometheus + Actuator) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
