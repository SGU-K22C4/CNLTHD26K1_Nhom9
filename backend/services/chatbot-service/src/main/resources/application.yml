spring:
  application:
    name: chatbot-service
  config:
    import: "optional:configserver:http://localhost:8888"
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://tienle:pass123@cluster0.y6jck.mongodb.net/fashion_chatbot_db}

# === Service URLs ===
chatbot:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8080}
  promotion-service-url: ${PROMOTION_SERVICE_URL:http://localhost:8080}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8080}

  # Agent mode: true = LangChain4j agent, false = heuristic fallback
  use-agent: ${CHATBOT_USE_AGENT:true}

  # Memory
  memory:
    max-messages: ${CHATBOT_MEMORY_MAX_MESSAGES:20}

  # Knowledge Base
  knowledge:
    enabled: ${CHATBOT_KB_ENABLED:true}
    data-path: classpath:knowledge
    top-k: 4
    min-score: 0.3

# === OpenRouter / LLM ===
openrouter:
  api-key: ${OPENROUTER_API_KEY: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}
  model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  fallback-model: ${OPENROUTER_FALLBACK_MODEL:openrouter/auto}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  max-tokens: ${OPENROUTER_MAX_TOKENS:600}
  site-url: ${OPENROUTER_SITE_URL:http://localhost:8087}
  app-name: ${OPENROUTER_APP_NAME:fashion-chatbot-service}

server:
  port: ${SERVER_PORT:8087}
