spring:
  application:
    name: review-service
  config:
    import: "optional:configserver:http://localhost:8888"

review:
  integration:
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8084}

# ── Monitoring (Prometheus + Actuator) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
