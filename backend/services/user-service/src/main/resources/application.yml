server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fashion_user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:huytran123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:${EMAIL_USERNAME:pcshop7153@gmail.com}}
    password: ${SPRING_MAIL_PASSWORD:${EMAIL_PASSWORD:tvpwqiovicyfkbfq}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:ZmFzaGlvbi1lLWNvbW1lcmNlLXNlY3JldC1rZXktdGhhdC1pcy1sb25nLWVub3VnaC0zMmJ5dGVz}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.fashion.userservice: DEBUG
    org.springframework.security: INFO
app:
  auth:
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
