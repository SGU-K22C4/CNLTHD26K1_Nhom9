server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/fashion_user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:2525}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${EMAIL_USERNAME:}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${EMAIL_PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${spring.mail.username}}
  auth:
    email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    admin-full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:System Admin}

logging:
  level:
    com.fashion.userservice: DEBUG
    org.springframework.security: INFO
