server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fashion_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

jwt:
  secret: ${JWT_SECRET:base64-encoded-secret-key-at-least-32-bytes-long-here}
  expiration: ${JWT_EXPIRATION:900000}           # 15 phút (ms)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 ngày (ms)

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.fashion.userservice: DEBUG
    org.springframework.security: INFO
