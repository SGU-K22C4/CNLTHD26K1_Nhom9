name: fashion

services:

  # ── Databases ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: fashion_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-huytran123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: fashion_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: fashion_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Services ───────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ../backend
      dockerfile: services/user-service/Dockerfile
    container_name: fashion_user_service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-huytran123}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy

  product-service:
    build:
      context: ../backend
      dockerfile: services/product-service/Dockerfile
    container_name: fashion_product_service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-huytran123}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  cart-service:
    build:
      context: ../backend
      dockerfile: services/cart-service/Dockerfile
    container_name: fashion_cart_service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ../backend
      dockerfile: services/order-service/Dockerfile
    container_name: fashion_order_service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-huytran123}
      - JWT_SECRET=${JWT_SECRET}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-XWJEG5N8}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-V0UJ9R7MWMJLFJREF60KQR5P9RO1XIYH}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:5173/payment/vnpay-return}
    depends_on:
      mysql:
        condition: service_healthy

  promotion-service:
    build:
      context: ../backend
      dockerfile: services/promotion-service/Dockerfile
    container_name: fashion_promotion_service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_promotion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-huytran123}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  review-service:
    build:
      context: ../backend
      dockerfile: services/review-service/Dockerfile
    container_name: fashion_review_service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/fashion_review_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  chatbot-service:
    build:
      context: ../backend
      dockerfile: services/chatbot-service/Dockerfile
    container_name: fashion_chatbot_service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}

  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: fashion_api_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - CART_SERVICE_URL=http://cart-service:8083
      - ORDER_SERVICE_URL=http://order-service:8084
      - PROMOTION_SERVICE_URL=http://promotion-service:8085
      - REVIEW_SERVICE_URL=http://review-service:8086
      - CHATBOT_SERVICE_URL=http://chatbot-service:8087
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service

volumes:
  mysql_data:
  redis_data:
  mongo_data:
