name: fashion

services:

  # ── Databases ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: fashion_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: fashion_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fashion_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fashion_kafka_ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=fashion
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_READONLY=false
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      kafka:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: fashion_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
  # ── Services ───────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ../backend
      dockerfile: services/user-service/Dockerfile
    container_name: fashion-user-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_REFRESH_EXPIRATION=604800000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - APP_FRONTEND_URL=http://localhost:5173
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME:?MAIL_USERNAME is required}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      - MAIL_FROM=${MAIL_FROM:-no-reply@localhost}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy

  product-service:
    build:
      context: ../backend
      dockerfile: services/product-service/Dockerfile
    container_name: fashion-product-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  cart-service:
    build:
      context: ../backend
      dockerfile: services/cart-service/Dockerfile
    container_name: fashion-cart-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8083
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build:
      context: ../backend
      dockerfile: services/order-service/Dockerfile
    container_name: fashion-order-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://jaeger:9411/api/v2/spans
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-XWJEG5N8}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET is required}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - VNPAY_API_URL=${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:5173/payment/vnpay-return}
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - PROMOTION_SERVICE_URL=http://promotion-service:8085
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  promotion-service:
    build:
      context: ../backend
      dockerfile: services/promotion-service/Dockerfile
    container_name: fashion-promotion-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fashion_promotion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - SPRING_CLOUD_CONFIG_ENABLED=false
    depends_on:
      mysql:
        condition: service_healthy

  review-service:
    build:
      context: ../backend
      dockerfile: services/review-service/Dockerfile
    container_name: fashion-review-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8086
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - SPRING_CLOUD_CONFIG_ENABLED=true

      - ORDER_SERVICE_URL=http://order-service:8084
      - PROMOTION_SERVICE_URL=http://promotion-service:8085

  chatbot-service:
    build:
      context: ../backend
      dockerfile: services/chatbot-service/Dockerfile
    container_name: fashion-chatbot-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8087
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - AI_API_KEY=${AI_API_KEY:?AI_API_KEY is required}
      - AI_MODEL=${AI_MODEL:-deepseek-3.2}
      - AI_BASE_URL=${AI_BASE_URL:-https://llm.chiasegpu.vn/v1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - SPRING_CLOUD_CONFIG_ENABLED=true

      - PRODUCT_SERVICE_URL=http://product-service:8082
      - PROMOTION_SERVICE_URL=http://promotion-service:8085
      - ORDER_SERVICE_URL=http://order-service:8084
      - CART_SERVICE_URL=http://cart-service:8083
      - REVIEW_SERVICE_URL=http://review-service:8086

  # ── Kong Gateway (replaces Spring Cloud API Gateway) ─────────────────────
  # DB-less mode: all config loaded from kong.yml declarative file.
  # Custom jwt-auth Lua plugin validates HS256 tokens and injects
  # X-User-Id / X-User-Email headers to downstream services.
  #
  # JWT_SECRET is injected into kong.yml at startup via entrypoint wrapper
  # (Kong DB-less mode does not support env var interpolation natively).
  kong:
    image: kong:3.7-ubuntu
    container_name: fashion_kong_gateway
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/kong/docker-entrypoint-wrapper.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8080
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      # Load custom jwt-auth plugin
      KONG_PLUGINS: bundled,jwt-auth
      KONG_LUA_PACKAGE_PATH: /kong/custom-plugins/?.lua;/kong/custom-plugins/?/init.lua;;
      # JWT secret — shared with all Spring Boot services
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # KONG_DECLARATIVE_CONFIG is set by the entrypoint wrapper after env substitution
    ports:
      - "8080:8080"   # Proxy (frontend calls this)
    volumes:
      - ./kong.yml:/kong/template/kong.yml.template:ro
      - ./kong/docker-entrypoint-wrapper.sh:/kong/docker-entrypoint-wrapper.sh:ro
      - ./kong/plugins/jwt-auth:/kong/custom-plugins/kong/plugins/jwt-auth:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mysql
      - redis
      # - user-service
      # - product-service
      # - cart-service
      # - order-service
      # - promotion-service
      # - review-service
      # - chatbot-service

volumes:
  mysql_data:
  redis_data:
  kafka_data:
