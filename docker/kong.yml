_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        - https://modimal.tranhuy.dev
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Origin
        - X-Auth-Token
        - X-Requested-With
        - X-User-Id
        - X-User-Email
      exposed_headers:
        - Authorization
      credentials: false
      max_age: 3600

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: auth-public-route
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/forgot-password
          - /api/v1/auth/reset-password
          - /api/v1/auth/verify-email
          - /api/v1/auth/resend-verification
        strip_path: false
      - name: auth-logout-route
        paths:
          - /api/v1/auth/logout
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"
      - name: user-route
        paths:
          - /api/v1/users
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"

  - name: product-service
    url: http://product-service:8082
    routes:
      - name: product-public-route
        paths:
          - /api/v1/products
          - /api/v1/categories
        methods:
          - GET
        strip_path: false
      - name: product-write-route
        paths:
          - /api/v1/products
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"
      - name: wishlist-route
        paths:
          - /api/v1/wishlists
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"

  - name: cart-service
    url: http://cart-service:8083
    routes:
      - name: cart-route
        paths:
          - /api/v1/cart
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"

  - name: order-service
    url: http://order-service:8084
    routes:
      - name: order-route
        paths:
          - /api/v1/orders
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"
      - name: payment-return-public-route
        paths:
          - /api/v1/payments/vnpay/payment-return
        strip_path: false
      - name: payment-route
        paths:
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"

  - name: promotion-service
    url: http://promotion-service:8085
    routes:
      - name: promotion-public-route
        paths:
          - /api/v1/promotions/active
          - /api/v1/promotions/validate
        strip_path: false
      - name: loyalty-route
        paths:
          - /api/v1/promotions/loyalty
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"

  - name: review-service
    url: http://review-service:8086
    routes:
      - name: review-public-route
        paths:
          - /api/v1/reviews/product
        strip_path: false
      - name: review-route
        paths:
          - /api/v1/reviews
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"

  - name: chatbot-service
    url: http://chatbot-service:8087
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 180000
    retries: 0
    routes:
      - name: chatbot-chat-public-route
        paths:
          - /api/v1/chatbot/chat
        strip_path: false
      - name: chatbot-session-route
        paths:
          - /api/v1/chatbot/sessions
        strip_path: false
        plugins:
          - name: jwt-auth
            config:
              jwt_secret: "${JWT_SECRET}"
