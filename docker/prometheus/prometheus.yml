global:
  scrape_interval: 15s          # Thu thập metrics mỗi 15 giây
  evaluation_interval: 15s      # Đánh giá rules mỗi 15 giây

scrape_configs:
  # ── Self-monitoring ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Spring Boot Microservices ──
  - job_name: 'user-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8081']

  - job_name: 'product-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['product-service:8082']

  - job_name: 'cart-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['cart-service:8083']

  - job_name: 'order-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:8084']

  - job_name: 'promotion-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['promotion-service:8085']

  - job_name: 'review-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['review-service:8086']

  - job_name: 'chatbot-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chatbot-service:8087']

  # ── Kong Gateway ──
  - job_name: 'kong-gateway'
    static_configs:
      - targets: ['kong:8001']
