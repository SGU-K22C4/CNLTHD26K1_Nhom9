# ── AOF Persistence ──────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"

# fsync policy: "everysec" = tốt nhất cho cân bằng hiệu suất & độ bền
# - "always"   : fsync mỗi lệnh ghi (chậm, an toàn nhất)
# - "everysec" : fsync mỗi giây (khuyên dùng — mất tối đa 1s dữ liệu)
# - "no"       : để OS quyết định (nhanh, kém an toàn)
appendfsync everysec

# ── RDB Snapshot (giữ lại để backup nhanh) ───────────────
save 900 1
save 300 10
save 60 10000
