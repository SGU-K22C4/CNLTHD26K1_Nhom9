# ============================================================================
# Kubernetes Microservices — Fashion E-commerce
# All 7 backend services + frontend in a single file.
# Each service has: Deployment + ClusterIP Service
# Optimized for student VPS: replicas=1, JVM memory limited.
#
# ⚠️ IMPORTANT: Before deploying, Docker images must be built and pushed:
#    docker build -t fashion/user-service:latest -f services/user-service/Dockerfile .
#    docker push fashion/user-service:latest  (or use a private registry)
#    In CI/CD, these image lines are treated as bootstrap defaults only.
#    GitHub Actions will update each Deployment to an immutable SHA tag via
#    `kubectl set image` right after applying this manifest.
# ============================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1. User Service (port 8081) — MySQL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fashion
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: huyhuy19/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: USER_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fashion-secrets
                  key: JWT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fashion-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: MAIL_PORT
            - name: MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: MAIL_FROM
            - name: EMAIL_VERIFICATION_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: EMAIL_VERIFICATION_REQUIRED
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: fashion-config
                  key: FRONTEND_URL
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "400Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fashion
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

