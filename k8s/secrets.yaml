# ============================================================================
# Kubernetes Secrets — Fashion E-commerce
# Contains sensitive credentials (Base64-encoded).
#
# ⚠️ IMPORTANT: In production, use a Secret management tool (Vault, SOPS)
#    instead of committing secrets to Git. This file is for development/demo.
#
# To encode a value: echo -n "your-value" | base64
# To decode a value: echo "encoded-value" | base64 -d
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fashion-secrets
  namespace: fashion
  labels:
    app.kubernetes.io/part-of: fashion-ecommerce
type: Opaque
data:
  # MySQL root password (base64 of replace-with-mysql-root-password)
  MYSQL_ROOT_PASSWORD: cmVwbGFjZS13aXRoLW15c3FsLXJvb3QtcGFzc3dvcmQ=
  # JWT Secret (HMAC key shared between Kong and all Spring Boot services)
  JWT_SECRET: cmVwbGFjZS13aXRoLWp3dC1zZWNyZXQtYXQtbGVhc3QtMzItYnl0ZXM=
  # Brevo SMTP credentials (MAIL_USERNAME must be login like xxx@smtp-brevo.com)
  MAIL_USERNAME: cmVwbGFjZS13aXRoLWJyZXZvLWxvZ2luQHNtdHAtYnJldm8uY29t
  MAIL_PASSWORD: cmVwbGFjZS13aXRoLWJyZXZvLXNtdHAta2V5
  # VNPay credentials
  VNPAY_TMN_CODE: WFdKRUc1Tjg=
  VNPAY_HASH_SECRET: cmVwbGFjZS13aXRoLXZucGF5LWhhc2gtc2VjcmV0
